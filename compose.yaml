version: '3.8'

services:
  # 1. PostgreSQL
  postgres-nomina-db:
    image: postgres:16-alpine
    container_name: postgres-nomina
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_empleados}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_nomina_data:/var/lib/postgresql/data
    networks:
      - nomina-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_empleados}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. SQL Server
  sqlserver-asistencia-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-asistencia
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:-YourPassword123!}
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver_asistencia_data:/var/opt/mssql
    networks:
      - nomina-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_PASSWORD:-YourPassword123!}' -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Oracle Database
  oracle-nomina-db:
    image: gvenzl/oracle-free:23.4-slim
    container_name: oracle-nomina
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle123}
      APP_USER: ${ORACLE_USER:-app_nomina}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-oracle123}
    volumes:
      - oracle_nomina_data:/opt/oracle/oradata
    networks:
      - nomina-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    healthcheck:
      test: [ "CMD-SHELL", "healthcheck.sh" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # 4. MongoDB
  mongodb-boletas-db:
    image: mongo:7.0
    container_name: mongodb-boletas
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-db_boletas}
    volumes:
      - mongodb_boletas_data:/data/db
    networks:
      - nomina-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Rest de Nómina
  nomina-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nomina-api
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - POSTGRES_HOST=postgres-nomina-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-db_empleados}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SQLSERVER_HOST=sqlserver-asistencia-db
      - SQLSERVER_PORT=1433
      - SQLSERVER_DB=${SQLSERVER_DB:-db_asistencia}
      - SQLSERVER_USER=${SQLSERVER_USER:-sa}
      - SQLSERVER_PASSWORD=${SQLSERVER_PASSWORD:-YourPassword123!}
      - ORACLE_HOST=oracle-nomina-db
      - ORACLE_PORT=1521
      - ORACLE_SERVICE=FREEPDB1
      - ORACLE_USER=${ORACLE_USER:-app_nomina}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-oracle123}
      - MONGO_HOST=mongodb-boletas-db
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DB:-db_boletas}
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-admin123}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
    networks:
      - nomina-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    depends_on:
      postgres-nomina-db:
        condition: service_healthy
      sqlserver-asistencia-db:
        condition: service_healthy
      oracle-nomina-db:
        condition: service_healthy
      mongodb-boletas-db:
        condition: service_healthy

volumes:
  postgres_nomina_data:
  sqlserver_asistencia_data:
  oracle_nomina_data:
  mongodb_boletas_data:

networks:
  nomina-net:
    driver: bridge